<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Onchain Crime Watcher — Follow the flow.</title>
  <desc id="desc">An abstract radar and connected nodes on a dark grid. Project branding, not a visualization of live data.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a111b"/><stop offset="1" stop-color="#101c29"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7cf9b2" stop-opacity=".12"/><stop offset="1" stop-color="#7cf9b2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7893ac" stroke-opacity=".09"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="url(#background)" stroke="#28394a"/>
  <rect x="16" y="16" width="1168" height="308" rx="12" fill="url(#grid)"/>
  <circle cx="972" cy="170" r="162" fill="url(#glow)"/>
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <path d="M64 56H96" stroke="#7cf9b2" stroke-width="3"/>
    <text x="112" y="61" font-size="12" letter-spacing="2" fill="#b2c4d4">SOLANA ACTIVITY / OPEN SOURCE</text>
    <g fill="#f0f5fa" font-size="62" font-weight="700" letter-spacing="-2">
      <text x="60" y="139">ONCHAIN</text><text x="60" y="205">CRIME WATCHER</text>
    </g>
    <text x="64" y="250" font-size="22" fill="#7cf9b2">Follow the flow.</text>
    <text x="64" y="298" font-size="11" letter-spacing="2.2" fill="#8da4b8">RUST / SOLANA / DISCORD</text>
  </g>
  <g fill="none" stroke="#7cf9b2">
    <circle cx="972" cy="170" r="116" stroke-opacity=".25"/>
    <circle cx="972" cy="170" r="80" stroke-opacity=".18"/>
    <circle cx="972" cy="170" r="43" stroke-opacity=".2"/>
    <path d="M839 170H1105M972 37V303" stroke-opacity=".12"/>
    <path d="M972 170L1054 88A116 116 0 0 1 1088 170Z" fill="#7cf9b2" fill-opacity=".06" stroke-opacity=".12"/>
    <path d="M829 226L899 213L947 144L1007 159L1050 103L1110 124" stroke-width="2" stroke-opacity=".65"/>
    <g fill="#101c29" stroke-width="2"><circle cx="829" cy="226" r="5"/><circle cx="899" cy="213" r="6"/><circle cx="947" cy="144" r="7"/><circle cx="1007" cy="159" r="5"/><circle cx="1110" cy="124" r="5"/></g>
  </g>
  <circle cx="1050" cy="103" r="13" fill="#ff7595" fill-opacity=".12"/>
  <circle cx="1050" cy="103" r="5" fill="#ff7595"/>
  <circle cx="934" cy="246" r="4" fill="#ad96ff"/>
  <path d="M810 73V49H834M1110 291H1134V267" fill="none" stroke="#ad96ff" stroke-opacity=".6" stroke-width="2"/>
